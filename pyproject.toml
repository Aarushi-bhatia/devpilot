[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-pilot"
version = "0.1.0"
description = "A transparent, terminal-first autonomous GitHub software engineer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
devpilot = "devpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
