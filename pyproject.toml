[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-pilot"
version = "0.1.0"
description = "A transparent, terminal-first autonomous GitHub software engineer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aarushi Bhatia" }]
keywords = ["agent", "github", "automation", "llm", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/Aarushi-bhatia/devpilot"
Repository = "https://github.com/Aarushi-bhatia/devpilot"

[project.scripts]
devpilot = "devpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
